<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة الكشتة</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2418;--mut:#7a6f5f;--ac:#ff8a05;--bd:#e8dfd0;--ok:#1d8a4b;--bad:#c63d2f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1610;--card:#262017;--tx:#f3ece0;--mut:#a89c88;--bd:#3a3225;--ok:#4cc783;--bad:#ff7a6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1610;--card:#262017;--tx:#f3ece0;--mut:#a89c88;--bd:#3a3225;--ok:#4cc783;--bad:#ff7a6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px;text-align:center}
.sub{color:var(--mut);text-align:center;font-size:14px;margin:0 0 16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.r{display:flex;gap:8px;margin-bottom:8px}
.r>*{flex:1}.r>button{flex:0 0 auto}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--bad);padding:6px 10px;border:1px solid var(--bd)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:4px 12px}
.chip b{cursor:pointer;color:var(--bad);font-size:18px;line-height:1}
.it{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.it:first-of-type{border-top:0}
.it .n{flex:1}.it small{color:var(--mut);display:block}
.it input{width:90px;padding:8px}
.e{color:var(--mut);font-size:14px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.st div{background:var(--bg);border-radius:10px;padding:10px 4px}
.st b{font-size:20px;display:block}.st span{font-size:12px;color:var(--mut)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--bd)}
.pv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pv button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:6px 12px;font-weight:500}.pv button:disabled{opacity:.35}.pv button.all{background:var(--ac);color:#fff;border:0}.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-weight:500}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.lbl{font-size:13px;color:var(--mut);margin:8px 0 4px}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad);font-weight:600}
</style>
</head>
<body>
<div class="w">
<h1>🏕️ حاسبة الكشتة</h1>
<p class="sub">سجّل المشاركين والأغراض، والحاسبة تطلع لك الحساب</p>

<div class="c"><h2>١ اسم الرحلة</h2><input id="trip" placeholder="مثال: كشتة الثمامة"></div>

<div class="c"><h2>٢ المشاركون</h2>
<div class="r"><input id="pn" placeholder="اسم المشارك"><button id="addP">إضافة</button></div>
<div class="lbl">أو اختر من الأسماء الجاهزة:</div><div class="pv" id="pre"></div>
<div class="chips" id="people" style="margin-top:12px"></div></div>

<div class="c"><h2>٣ الأغراض</h2>
<input id="in" placeholder="الغرض (مثال: فحم)" style="margin-bottom:8px">
<div class="r"><select id="who"></select><input id="am" type="text" inputmode="decimal" placeholder="المبلغ (اختياري)"></div>
<button id="addI" style="width:100%">إضافة الغرض</button>
<div id="items" style="margin-top:10px"></div></div>

<div class="c"><h2>٤ الحساب النهائي</h2>
<div class="st"><div><b id="tot">0</b><span>الإجمالي (ريال)</span></div><div><b id="cnt">0</b><span>المشاركين</span></div><div><b id="sh">0</b><span>نصيب الفرد</span></div></div>
<div class="lbl" style="margin-top:14px">طريقة التسوية:</div>
<div class="seg"><button id="mD">كل واحد يحوّل للثاني</button><button id="mM">التحويل لأمير الرحلة</button></div>
<div id="mgrBox" style="display:none;margin-bottom:8px"><select id="mgr"></select></div>
<input id="iban" placeholder="رقم الحساب / الآيبان (اختياري، يظهر في الـPDF)" style="margin-bottom:8px">
<div id="set"></div>
<button id="pdf" style="width:100%;margin-top:12px">📄 تحميل النتيجة PDF</button></div>

<button class="g" id="reset" style="width:100%">رحلة جديدة (مسح البيانات)</button>
<p class="e" style="text-align:center">بياناتك محفوظة على جهازك فقط</p>
</div>

<script>
var PRE=["عبدالمجيد","عبدالملك","همام","عيسى","عبدالله","مهند","ايمن","عمار","عبدالعزيز","جواد","أنس","سهيل","معاذ","محمد","ياسر","خالد"];
var S={trip:"",people:[],items:[],mode:"direct",mgr:0,iban:""};
var K="kashta-v1";
function load(){try{var v=localStorage.getItem(K);if(v){var o=JSON.parse(v);for(var k in o)S[k]=o[k]}}catch(e){}}
function num(v){v=String(v==null?"":v).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776}).replace(/[٫،]/g,".").replace(/[٬,\s]/g,"");var n=parseFloat(v);return isNaN(n)?0:n}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(n){return (Math.round(n*100)/100).toLocaleString("en")}

function render(){
  $("trip").value=S.trip||"";
  $("people").innerHTML=S.people.length?S.people.map(function(p,i){return '<span class="chip">'+esc(p)+'<b data-dp="'+i+'">×</b></span>'}).join(""):'<span class="e">ما أضفت أحد بعد.</span>';
  $("pre").innerHTML='<button class="all" data-all="1">إضافة الكل</button>'+PRE.map(function(n,i){return '<button data-pre="'+i+'"'+(S.people.indexOf(n)>-1?' disabled':'')+'>'+esc(n)+'</button>'}).join("");
  if(S.mgr>=S.people.length)S.mgr=0;
  $("mgr").innerHTML=S.people.map(function(p,i){return '<option value="'+i+'"'+(i===S.mgr?' selected':'')+'>أمير الرحلة: '+esc(p)+'</option>'}).join("");
  $("mgrBox").style.display=S.mode==="mgr"?"block":"none";
  $("mD").className=S.mode==="direct"?"on":"";$("mM").className=S.mode==="mgr"?"on":"";
  $("iban").value=S.iban||"";
  var sel=$("who"),cur=sel.value;
  sel.innerHTML='<option value="">اختر المسؤول</option>'+S.people.map(function(p,i){return '<option value="'+i+'">'+esc(p)+'</option>'}).join("");
  if(cur&&S.people[cur])sel.value=cur;
  $("items").innerHTML=S.items.length?S.items.map(function(it,i){
    var w=S.people[it.who];
    return '<div class="it"><div class="n">'+esc(it.name)+'<small>المسؤول: '+(w?esc(w):'—')+'</small></div><input type="text" inputmode="decimal" placeholder="المبلغ" value="'+(it.amount===""?"":it.amount)+'" data-am="'+i+'"><button class="g" data-di="'+i+'">حذف</button></div>'
  }).join(""):'<span class="e">ما سجلت أغراض بعد.</span>';
  calc();
}

function compute(){
  var n=S.people.length,paid=S.people.map(function(){return 0}),tot=0;
  S.items.forEach(function(it){var a=num(it.amount);if(a>0){tot+=a;if(S.people[it.who]!==undefined)paid[it.who]+=a}});
  var sh=n?tot/n:0;
  var bal=S.people.map(function(p,i){return{n:p,b:paid[i]-sh,i:i}});
  var tr=[];
  if(n&&tot){
    if(S.mode==="mgr"&&S.people[S.mgr]!==undefined){
      var m=S.people[S.mgr];
      bal.forEach(function(x){
        if(x.i===S.mgr)return;
        if(x.b<-0.005)tr.push({f:x.n,t:m,a:-x.b});
        else if(x.b>0.005)tr.push({f:m,t:x.n,a:x.b});
      });
    }else{
      var d=bal.filter(function(x){return x.b<-0.005}).map(function(x){return{n:x.n,b:-x.b}});
      var cr=bal.filter(function(x){return x.b>0.005}).map(function(x){return{n:x.n,b:x.b}});
      var i=0,j=0;
      while(i<d.length&&j<cr.length){
        var q=Math.min(d[i].b,cr[j].b);tr.push({f:d[i].n,t:cr[j].n,a:q});
        d[i].b-=q;cr[j].b-=q;
        if(d[i].b<0.005)i++;if(cr[j].b<0.005)j++;
      }
    }
  }
  return{n:n,tot:tot,sh:sh,bal:bal,tr:tr};
}
function calc(){
  var r=compute();
  $("tot").textContent=fmt(r.tot);$("cnt").textContent=r.n;$("sh").textContent=fmt(r.sh);
  var h="";
  if(!r.n||!r.tot){h='<span class="e">أضف مشاركين وأغراض مشتراة عشان يظهر الحساب.</span>'}
  else{
    r.bal.forEach(function(x){
      var c=x.b>0.005?"pos":x.b<-0.005?"neg":"";
      var t=x.b>0.005?"له "+fmt(x.b):x.b<-0.005?"عليه "+fmt(-x.b):"متساوي";
      h+='<div class="row"><span>'+esc(x.n)+'</span><span class="'+c+'">'+t+'</span></div>'
    });
    h+='<h2 style="margin-top:14px">التحويلات</h2>';
    if(!r.tr.length)h+='<span class="e">ما فيه تحويلات.</span>';
    r.tr.forEach(function(x){h+='<div class="row"><span>'+esc(x.f)+' ← '+esc(x.t)+'</span><b>'+fmt(x.a)+' ريال</b></div>'});
  }
  $("set").innerHTML=h;
}

$("addP").onclick=function(){
  var v=$("pn").value.trim();if(!v)return;
  S.people.push(v);$("pn").value="";save();render();
};
$("pn").onkeydown=function(e){if(e.key==="Enter")$("addP").click()};
$("addI").onclick=function(){
  var nm=$("in").value.trim();if(!nm)return;
  var w=$("who").value;
  S.items.push({name:nm,who:w===""?-1:parseInt(w,10),amount:$("am").value.trim()});
  $("in").value="";$("am").value="";save();render();
};
$("trip").oninput=function(){S.trip=this.value;save()};
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.dataset.dp!==undefined){
    var k=parseInt(t.dataset.dp,10);
    S.people.splice(k,1);
    S.items.forEach(function(it){if(it.who===k)it.who=-1;else if(it.who>k)it.who--});
    save();render();
  }
  if(t.dataset.pre!==undefined){var nm=PRE[parseInt(t.dataset.pre,10)];if(S.people.indexOf(nm)<0){S.people.push(nm);save();render()}}
  if(t.dataset.all){PRE.forEach(function(nm){if(S.people.indexOf(nm)<0)S.people.push(nm)});save();render()}
  if(t.dataset.di!==undefined){S.items.splice(parseInt(t.dataset.di,10),1);save();render()}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset.am!==undefined){S.items[parseInt(t.dataset.am,10)].amount=t.value;save();calc()}
});
$("reset").onclick=function(){
  if(confirm("تبي تمسح كل البيانات؟")){S={trip:"",people:[],items:[],mode:"direct",mgr:0,iban:""};save();render()}
};
$("mD").onclick=function(){S.mode="direct";save();render()};
$("mM").onclick=function(){S.mode="mgr";save();render()};
$("mgr").onchange=function(){S.mgr=parseInt(this.value,10);save();calc()};
$("iban").oninput=function(){S.iban=this.value;save()};

/* ---- PDF: draw on canvas (browser handles Arabic shaping) then wrap JPEGs in a PDF ---- */
function buildPages(){
  var r=compute(),W=1240,H=1754,M=90,pages=[],cv,cx,y;
  var FONT='"Segoe UI",Tahoma,Arial,sans-serif',OR="#d98a45",TX="#2b2418",MU="#7a6f5f",BG="#fdf3e6",BD="#f0dcc0";
  function np(){cv=document.createElement("canvas");cv.width=W;cv.height=H;cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,W,H);cx.direction="rtl";cx.textBaseline="middle";y=M;pages.push(cv)}
  function need(h){if(y+h>H-M)np()}
  function tx(t,x,al,sz,col,bold,yy){cx.font=(bold?"bold ":"")+sz+"px "+FONT;cx.fillStyle=col||TX;cx.textAlign=al;cx.fillText(t,x,yy==null?y:yy)}
  function rr(x,yy,w,h,fill,stroke){cx.beginPath();cx.roundRect?cx.roundRect(x,yy,w,h,16):cx.rect(x,yy,w,h);cx.fillStyle=fill;cx.fill();if(stroke){cx.strokeStyle=stroke;cx.lineWidth=2;cx.stroke()}}
  function sec(t){need(120);y+=50;cx.fillStyle=OR;cx.fillRect(W-M-8,y-22,8,44);tx(t,W-M-26,"right",36,OR,true);y+=46}
  var R=W-M-24,L=M+24,C=W/2;
  np();y=M+40;
  tx("حاسبة الكشتة",W/2,"center",64,OR,true);y+=70;
  tx(S.trip||"رحلة بدون اسم",W/2,"center",40,TX,true);y+=52;
  tx(new Date().toLocaleDateString("en-GB"),W/2,"center",26,MU);y+=40;
  cx.fillStyle=TX;cx.fillRect(W/2-160,y,320,5);y+=50;
  var bw=(W-2*M-2*20)/3,bx=[W-M-bw,W-M-2*bw-20,M],vals=[[fmt(r.sh),"نصيب كل شخص (ريال)"],[String(r.n),"المشاركون"],[fmt(r.tot),"إجمالي المصاريف (ريال)"]];
  vals.forEach(function(v,i){rr(bx[i],y,bw,130,BG,BD);tx(v[0],bx[i]+bw/2,"center",44,OR,true,y+48);tx(v[1],bx[i]+bw/2,"center",24,MU,false,y+97)});
  y+=170;
  need(60);rr(M,y,W-2*M,58,OR);
  tx("الغرض",R,"right",28,"#fff",true,y+29);tx("المسؤول",C,"center",28,"#fff",true,y+29);tx("المبلغ",L,"left",28,"#fff",true,y+29);y+=58;
  if(!S.items.length){tx("لا يوجد أغراض",C,"center",26,MU,false,y+30);y+=60}
  S.items.forEach(function(it,i){
    need(58);var a=num(it.amount),w=S.people[it.who];
    if(i%2===0){cx.fillStyle=BG;cx.fillRect(M,y,W-2*M,56)}
    tx(it.name,R,"right",27,TX,false,y+28);tx(w||"—",C,"center",27,TX,false,y+28);tx(a>0?fmt(a)+" ريال":"لم يُشترَ",L,"left",27,a>0?TX:MU,false,y+28);y+=56;
  });
  sec("الحساب لكل شخص");
  r.bal.forEach(function(x){
    need(64);var paid=x.b+r.sh;
    tx(x.n,R,"right",30,TX,true,y+30);tx("دفع "+fmt(paid)+" ريال",C,"center",27,MU,false,y+30);
    tx(x.b>0.005?"له "+fmt(x.b)+" ريال":x.b<-0.005?"عليه "+fmt(-x.b)+" ريال":"متساوي",L,"left",28,x.b>0.005?"#1d8a4b":x.b<-0.005?"#c63d2f":MU,true,y+30);
    y+=62;cx.strokeStyle="#e8dfd0";cx.setLineDash([4,5]);cx.beginPath();cx.moveTo(M,y);cx.lineTo(W-M,y);cx.stroke();cx.setLineDash([]);
  });
  sec(S.mode==="mgr"&&S.people[S.mgr]?"التسوية عبر أمير الرحلة ("+S.people[S.mgr]+")":"التسوية بين المشاركين");
  if(!r.tr.length){tx("ما فيه تحويلات",C,"center",26,MU,false,y+30);y+=60}
  r.tr.forEach(function(x){
    need(80);rr(M,y,W-2*M,68,BG,BD);
    tx(x.f+" يعطي "+x.t,R,"right",28,TX,false,y+34);tx(fmt(x.a)+" ريال",L,"left",30,TX,true,y+34);y+=80;
  });
  if(S.iban&&S.iban.trim()){
    sec("رقم الحساب / الآيبان");need(90);rr(M,y,W-2*M,70,BG,BD);tx(S.iban.trim(),C,"center",32,TX,true,y+35);y+=80;
  }
  return pages;
}
function toBytes(dataUrl){var b=atob(dataUrl.split(",")[1]),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function makePdf(pages){
  var enc=new TextEncoder(),parts=[],off=0,xref=[];
  function put(x){var u=typeof x==="string"?enc.encode(x):x;parts.push(u);off+=u.length}
  function obj(id,body,stream){xref[id]=off;put(id+" 0 obj\n"+body);if(stream){put("\nstream\n");put(stream);put("\nendstream")}put("\nendobj\n")}
  var N=pages.length,kids=[];
  put("%PDF-1.4\n");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  for(var i=0;i<N;i++)kids.push((3+i*3)+" 0 R");
  obj(2,"<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+N+" >>");
  pages.forEach(function(cv,i){
    var pid=3+i*3,cid=pid+1,iid=pid+2,img=toBytes(cv.toDataURL("image/jpeg",0.92));
    var content="q 595 0 0 842 0 0 cm /Im0 Do Q";
    obj(pid,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 "+iid+" 0 R >> >> /Contents "+cid+" 0 R >>");
    obj(cid,"<< /Length "+content.length+" >>",content);
    obj(iid,"<< /Type /XObject /Subtype /Image /Width "+cv.width+" /Height "+cv.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+img.length+" >>",img);
  });
  var total=3+N*3,xs=off,x="xref\n0 "+total+"\n0000000000 65535 f \n";
  for(var k=1;k<total;k++)x+=("0000000000"+xref[k]).slice(-10)+" 00000 n \n";
  put(x+"trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xs+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
$("pdf").onclick=function(){
  var r=compute();if(!r.n||!r.tot){alert("أضف مشاركين وأغراض مشتراة أول");return}
  var btn=this;btn.disabled=true;
  try{
    var blob=makePdf(buildPages()),u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download=(S.trip?"نتيجة-"+S.trip:"حاسبة-الكشتة")+".pdf";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},60000);
  }catch(e){alert("تعذر إنشاء الملف")}
  btn.disabled=false;
};
load();render();
</script>
</body>
</html>
